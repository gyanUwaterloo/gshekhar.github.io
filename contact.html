<html><head><base href="https://radhil.com/contact">
<title>RadHIL - Contact Us</title>
<style>
  :root {
    --primary-color: #C9A050;
    --secondary-color: #1E2A3B;
    --accent-color: #E0C38C;
    --text-color: #333333;
    --bg-color: #FFFFFF;
    --card-bg: #F8F8F8;
    --nav-bg: #1E2A3B;
    --footer-bg: #1E2A3B;
    --footer-text: #FFFFFF;
    --input-bg: #FFFFFF;
    --input-border: #CCCCCC;
  }
  
  [data-theme="dark"] {
    --primary-color: #E0C38C;
    --secondary-color: #2C3E50;
    --accent-color: #C9A050;
    --text-color: #E6E6FA;
    --bg-color: #1A1A2E;
    --card-bg: #2D2D44;
    --nav-bg: #2C3E50;
    --footer-bg: #2C3E50;
    --footer-text: #E6E6FA;
    --input-bg: #2D2D44;
    --input-border: #4A4A6A;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: 'Playfair Display', serif;
    line-height: 1.6;
    color: var(--text-color);
    background-color: var(--bg-color);
    transition: all 0.3s ease;
  }

  .container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 20px;
  }

  .header {
    background-color: var(--nav-bg);
    color: #FFFFFF;
    padding: 1rem 0;
    position: fixed;
    width: 100%;
    z-index: 1000;
    transition: all 0.3s ease;
  }

  .header-content {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .logo-container {
    display: flex;
    align-items: center;
  }

  .logo-icon {
    font-size: 2rem;
    margin-right: 0.5rem;
  }

  .logo-text {
    font-size: 1.5rem;
    font-weight: bold;
    letter-spacing: 1px;
  }

  .nav {
    display: flex;
    gap: 1rem;
  }

  .nav a {
    color: #FFFFFF;
    text-decoration: none;
    padding: 0.5rem 1rem;
    border-radius: 5px;
    transition: all 0.3s ease;
    font-size: 0.9rem;
    font-weight: 500;
  }

  .nav a:hover, .nav a.active {
    background-color: var(--primary-color);
    color: var(--secondary-color);
  }

  .contact-content {
    padding: 6rem 0 4rem;
  }

  .contact-content h1 {
    font-size: 2.5rem;
    color: var(--primary-color);
    margin-bottom: 2rem;
  }

  .contact-info {
    display: flex;
    justify-content: space-between;
    margin-bottom: 3rem;
  }

  .contact-method {
    flex: 1;
    padding: 1rem;
    background-color: var(--card-bg);
    border-radius: 10px;
    margin: 0 1rem;
    text-align: center;
    transition: all 0.3s ease;
  }

  .contact-method:hover {
    transform: translateY(-5px);
    box-shadow: 0 5px 15px rgba(0,0,0,0.1);
  }

  .contact-method h3 {
    color: var(--primary-color);
    margin-bottom: 1rem;
  }

  .contact-form {
    background-color: var(--card-bg);
    padding: 2rem;
    border-radius: 10px;
  }

  .form-group {
    margin-bottom: 1.5rem;
  }

  .form-group label {
    display: block;
    margin-bottom: 0.5rem;
    color: var(--primary-color);
  }

  .form-group input,
  .form-group textarea {
    width: 100%;
    padding: 0.5rem;
    border: 1px solid var(--input-border);
    border-radius: 5px;
    background-color: var(--input-bg);
    color: var(--text-color);
    font-family: inherit;
  }

  .form-group textarea {
    height: 150px;
  }

  .submit-btn {
    background-color: var(--primary-color);
    color: var(--secondary-color);
    border: none;
    padding: 0.75rem 1.5rem;
    font-size: 1rem;
    border-radius: 5px;
    cursor: pointer;
    transition: all 0.3s ease;
  }

  .submit-btn:hover {
    background-color: var(--accent-color);
  }

  .footer {
    background-color: var(--footer-bg);
    color: var(--footer-text);
    text-align: center;
    padding: 2rem 0;
    margin-top: 4rem;
  }

  .footer a {
    color: var(--footer-text);
    text-decoration: none;
    margin: 0 0.5rem;
  }

  .theme-switch-wrapper {
    display: flex;
    align-items: center;
  }

  .theme-switch {
    display: inline-block;
    height: 34px;
    position: relative;
    width: 60px;
  }

  .theme-switch input {
    display: none;
  }

  .slider {
    background-color: #ccc;
    bottom: 0;
    cursor: pointer;
    left: 0;
    position: absolute;
    right: 0;
    top: 0;
    transition: .4s;
    border-radius: 34px;
  }

  .slider:before {
    background-color: #fff;
    bottom: 4px;
    content: "";
    height: 26px;
    left: 4px;
    position: absolute;
    transition: .4s;
    width: 26px;
    border-radius: 50%;
  }

  input:checked + .slider {
    background-color: var(--primary-color);
  }

  input:checked + .slider:before {
    transform: translateX(26px);
  }

  @media (max-width: 768px) {
    .header-content {
      flex-direction: column;
      text-align: center;
    }
    .nav {
      margin-top: 1rem;
    }
    .contact-content h1 {
      font-size: 2rem;
    }
    .contact-info {
      flex-direction: column;
    }
    .contact-method {
      margin: 1rem 0;
    }
  }
</style>
</head>
<body>
  <header class="header">
    <div class="container">
      <div class="header-content">
        <div class="logo-container">
          <div class="logo-icon">🦚</div>
          <div class="logo-text">RadHIL</div>
        </div>
        <nav class="nav">
          <a href="https://radhil.com">Home</a>
          <a href="https://radhil.com/features">Features</a>
          <a href="https://radhil.com/pricing">Pricing</a>
          <a href="https://radhil.com/request-demo">Demo</a>
          <a href="https://radhil.com/support">Support</a>
        </nav>
        <div class="theme-switch-wrapper">
          <label class="theme-switch" for="checkbox">
            <input type="checkbox" id="checkbox" />
            <div class="slider"></div>
          </label>
        </div>
      </div>
    </div>
  </header>
  
  <main class="contact-content">
    <div class="container">
      <h1>Contact Us</h1>
      
      <div class="contact-info">
        <div class="contact-method">
          <h3>Email</h3>
          <p>support@radhil.com or tech.radhil@gmail.com</p>
        </div>
        <div class="contact-method">
          <h3>Phone</h3>
          <p>**********</p>
        </div>
        <div class="contact-method">
          <h3>Address</h3>
          <p>260 Wellesley St. East, Toronto, <br>CA M4X 1G6</p>
        </div>
      </div>
      
      <div class="contact-form">
        <h2>Send us a message</h2>
        <form id="contact-form" method="post" action="https://formspree.io/f/mqazjqeo">
          <div class="form-group">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" required>
          </div>
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>
          </div>
          <div class="form-group">
            <label for="subject">Subject</label>
            <input type="text" id="subject" name="subject" required>
          </div>
          <div class="form-group">
            <label for="message">Message</label>
            <textarea id="message" name="message" required></textarea>
          </div>
          <button type="submit" class="submit-btn">Send Message</button>
        </form>
      </div>
    </div>
  </main>
  
  <footer class="footer">
    <div class="container">
      <p>&copy; 2023 RadHIL. All rights reserved.</p>
      <p>
        <a href="https://radhil.com/privacy">Privacy Policy</a> | 
        <a href="https://radhil.com/terms">Terms of Service</a> |
        <a href="https://radhil.com/contact">Contact Us</a>
      </p>
    </div>
  </footer>

  <script>
    const toggleSwitch = document.querySelector('.theme-switch input[type="checkbox"]');
    const currentTheme = localStorage.getItem('theme');

    if (currentTheme) {
        document.documentElement.setAttribute('data-theme', currentTheme);
      
        if (currentTheme === 'dark') {
            toggleSwitch.checked = true;
        }
    }

    function switchTheme(e) {
        if (e.target.checked) {
            document.documentElement.setAttribute('data-theme', 'dark');
            localStorage.setItem('theme', 'dark');
        }
        else {
            document.documentElement.setAttribute('data-theme', 'light');
            localStorage.setItem('theme', 'light');
        }    
    }

    toggleSwitch.addEventListener('change', switchTheme, false);

    // Form submission handling
    const contactForm = document.getElementById('contact-form');
    contactForm.addEventListener('submit', function(e) {
      e.preventDefault();
      
      // Here you would typically send the form data to a server
      // For this example, we'll just log it to the console
      const formData = new FormData(contactForm);
      console.log('Form submitted with the following data:');
      for (let [key, value] of formData.entries()) {
        console.log(`${key}: ${value}`);
      }
      
      // Clear the form
      contactForm.reset();
      
      // Show a success message (in a real application, you'd want to handle errors as well)
      alert('Thank you for your message. We will get back to you soon!');
    });
  </script>
</body>
</html>
