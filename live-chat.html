<html><head><base href="https://radhil.com/live-chat">
<title>RadHIL - Interactive Live Chat Support</title>
<style>
  :root {
    --primary-color: #C9A050;
    --secondary-color: #1E2A3B;
    --accent-color: #E0C38C;
    --text-color: #333333;
    --bg-color: #FFFFFF;
    --card-bg: #F8F8F8;
    --nav-bg: #1E2A3B;
    --footer-bg: #1E2A3B;
    --footer-text: #FFFFFF;
    --chat-bg: #F0F0F0;
    --chat-user: #E1F5FE;
    --chat-agent: #FFF3E0;
    --option-bg: #E0E0E0;
    --option-hover: #D0D0D0;
  }
  
  [data-theme="dark"] {
    --primary-color: #E0C38C;
    --secondary-color: #2C3E50;
    --accent-color: #C9A050;
    --text-color: #E6E6FA;
    --bg-color: #1A1A2E;
    --card-bg: #2D2D44;
    --nav-bg: #2C3E50;
    --footer-bg: #2C3E50;
    --footer-text: #E6E6FA;
    --chat-bg: #2D2D44;
    --chat-user: #1E3A5F;
    --chat-agent: #4A3F35;
    --option-bg: #3D3D3D;
    --option-hover: #4D4D4D;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: 'Playfair Display', serif;
    line-height: 1.6;
    color: var(--text-color);
    background-color: var(--bg-color);
    transition: all 0.3s ease;
  }

  .container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 20px;
  }

  .header {
    background-color: var(--nav-bg);
    color: #FFFFFF;
    padding: 1rem 0;
    position: fixed;
    width: 100%;
    z-index: 1000;
    transition: all 0.3s ease;
  }

  .header-content {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .logo-container {
    display: flex;
    align-items: center;
  }

  .logo-icon {
    font-size: 2rem;
    margin-right: 0.5rem;
  }

  .logo-text {
    font-size: 1.5rem;
    font-weight: bold;
    letter-spacing: 1px;
  }

  .nav {
    display: flex;
    gap: 1rem;
  }

  .nav a {
    color: #FFFFFF;
    text-decoration: none;
    padding: 0.5rem 1rem;
    border-radius: 5px;
    transition: all 0.3s ease;
    font-size: 0.9rem;
    font-weight: 500;
  }

  .nav a:hover, .nav a.active {
    background-color: var(--primary-color);
    color: var(--secondary-color);
  }

  .live-chat-content {
    padding: 6rem 0 4rem;
  }

  .live-chat-content h1 {
    font-size: 2.5rem;
    color: var(--primary-color);
    margin-bottom: 2rem;
    text-align: center;
  }

  .chat-container {
    background-color: var(--card-bg);
    border-radius: 10px;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    overflow: hidden;
    max-width: 800px;
    margin: 0 auto;
  }

  .chat-messages {
    height: 400px;
    overflow-y: auto;
    padding: 1rem;
    background-color: var(--chat-bg);
  }

  .message {
    margin-bottom: 1rem;
    padding: 0.75rem;
    border-radius: 10px;
    max-width: 70%;
  }

  .user-message {
    background-color: var(--chat-user);
    align-self: flex-end;
    margin-left: auto;
  }

  .agent-message {
    background-color: var(--chat-agent);
    align-self: flex-start;
  }

  .chat-options {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    margin-top: 1rem;
  }

  .chat-option {
    background-color: var(--option-bg);
    border: none;
    padding: 0.5rem 1rem;
    border-radius: 20px;
    cursor: pointer;
    transition: background-color 0.3s ease;
  }

  .chat-option:hover {
    background-color: var(--option-hover);
  }

  .chat-input {
    display: flex;
    padding: 1rem;
    background-color: var(--card-bg);
  }

  .chat-input input {
    flex-grow: 1;
    padding: 0.5rem;
    border: 1px solid var(--primary-color);
    border-radius: 5px;
    margin-right: 0.5rem;
    font-family: inherit;
  }

  .chat-input button {
    background-color: var(--primary-color);
    color: var(--secondary-color);
    border: none;
    padding: 0.5rem 1rem;
    border-radius: 5px;
    cursor: pointer;
    transition: all 0.3s ease;
  }

  .chat-input button:hover {
    background-color: var(--accent-color);
  }

  .footer {
    background-color: var(--footer-bg);
    color: var(--footer-text);
    text-align: center;
    padding: 2rem 0;
    margin-top: 4rem;
  }

  .footer a {
    color: var(--footer-text);
    text-decoration: none;
    margin: 0 0.5rem;
  }

  .theme-switch-wrapper {
    display: flex;
    align-items: center;
  }

  .theme-switch {
    display: inline-block;
    height: 34px;
    position: relative;
    width: 60px;
  }

  .theme-switch input {
    display: none;
  }

  .slider {
    background-color: #ccc;
    bottom: 0;
    cursor: pointer;
    left: 0;
    position: absolute;
    right: 0;
    top: 0;
    transition: .4s;
    border-radius: 34px;
  }

  .slider:before {
    background-color: #fff;
    bottom: 4px;
    content: "";
    height: 26px;
    left: 4px;
    position: absolute;
    transition: .4s;
    width: 26px;
    border-radius: 50%;
  }

  input:checked + .slider {
    background-color: var(--primary-color);
  }

  input:checked + .slider:before {
    transform: translateX(26px);
  }

  @media (max-width: 768px) {
    .header-content {
      flex-direction: column;
      text-align: center;
    }
    .nav {
      margin-top: 1rem;
    }
    .live-chat-content h1 {
      font-size: 2rem;
    }
  }
</style>
</head>
<body>
  <header class="header">
    <div class="container">
      <div class="header-content">
        <div class="logo-container">
          <div class="logo-icon">🦚</div>
          <div class="logo-text">RadHIL</div>
        </div>
        <nav class="nav">
          <a href="https://radhil.com">Home</a>
          <a href="https://radhil.com/features">Features</a>
          <a href="https://radhil.com/pricing">Pricing</a>
          <a href="https://radhil.com/request-demo">Demo</a>
          <a href="https://radhil.com/support">Support</a>
        </nav>
        <div class="theme-switch-wrapper">
          <label class="theme-switch" for="checkbox">
            <input type="checkbox" id="checkbox" />
            <div class="slider"></div>
          </label>
        </div>
      </div>
    </div>
  </header>
  
  <main class="live-chat-content">
    <div class="container">
      <h1>Interactive Live Chat Support</h1>
      
      <div class="chat-container">
        <div class="chat-messages" id="chat-messages">
          <!-- Chat messages will be dynamically added here -->
        </div>
        <div class="chat-input">
          <input type="text" id="user-input" placeholder="Type your message here..." />
          <button id="send-button">Send</button>
        </div>
      </div>
    </div>
  </main>
  
  <footer class="footer">
    <div class="container">
      <p>&copy; 2023 RadHIL. All rights reserved.</p>
      <p>
        <a href="https://radhil.com/privacy">Privacy Policy</a> | 
        <a href="https://radhil.com/terms">Terms of Service</a> |
        <a href="https://radhil.com/contact">Contact Us</a>
      </p>
    </div>
  </footer>

  <script>
    const toggleSwitch = document.querySelector('.theme-switch input[type="checkbox"]');
    const currentTheme = localStorage.getItem('theme');

    if (currentTheme) {
        document.documentElement.setAttribute('data-theme', currentTheme);
      
        if (currentTheme === 'dark') {
            toggleSwitch.checked = true;
        }
    }

    function switchTheme(e) {
        if (e.target.checked) {
            document.documentElement.setAttribute('data-theme', 'dark');
            localStorage.setItem('theme', 'dark');
        }
        else {
            document.documentElement.setAttribute('data-theme', 'light');
            localStorage.setItem('theme', 'light');
        }    
    }

    toggleSwitch.addEventListener('change', switchTheme, false);

    // Interactive Live Chat Functionality
    const chatMessages = document.getElementById('chat-messages');
    const userInput = document.getElementById('user-input');
    const sendButton = document.getElementById('send-button');

    function addMessage(message, isUser = true) {
      const messageElement = document.createElement('div');
      messageElement.classList.add('message');
      messageElement.classList.add(isUser ? 'user-message' : 'agent-message');
      messageElement.textContent = message;
      chatMessages.appendChild(messageElement);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function addOptions(options) {
      const optionsContainer = document.createElement('div');
      optionsContainer.classList.add('chat-options');
      options.forEach(option => {
        const button = document.createElement('button');
        button.classList.add('chat-option');
        button.textContent = option.text;
        button.addEventListener('click', () => handleOptionClick(option));
        optionsContainer.appendChild(button);
      });
      chatMessages.appendChild(optionsContainer);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function handleOptionClick(option) {
      addMessage(option.text, true);
      processUserInput(option.value);
    }

    function processUserInput(input) {
      switch(input) {
        case 'product_info':
          addMessage("Great! I'd be happy to provide information about our products. What specific product line are you interested in?", false);
          addOptions([
            {text: "Software Solutions", value: "software"},
            {text: "Hardware Products", value: "hardware"},
            {text: "Cloud Services", value: "cloud"}
          ]);
          break;
        case 'software':
          addMessage("Our software solutions include project management tools, data analytics platforms, and custom enterprise software. Which area would you like more details on?", false);
          addOptions([
            {text: "Project Management", value: "project_management"},
            {text: "Data Analytics", value: "data_analytics"},
            {text: "Custom Enterprise Software", value: "enterprise_software"}
          ]);
          break;
        case 'hardware':
          addMessage("We offer a range of hardware products including servers, networking equipment, and IoT devices. What specific hardware are you looking for?", false);
          addOptions([
            {text: "Servers", value: "servers"},
            {text: "Networking Equipment", value: "networking"},
            {text: "IoT Devices", value: "iot"}
          ]);
          break;
        case 'cloud':
          addMessage("Our cloud services include infrastructure as a service (IaaS), platform as a service (PaaS), and software as a service (SaaS) solutions. Which cloud service model interests you most?", false);
          addOptions([
            {text: "Infrastructure as a Service (IaaS)", value: "iaas"},
            {text: "Platform as a Service (PaaS)", value: "paas"},
            {text: "Software as a Service (SaaS)", value: "saas"}
          ]);
          break;
        case 'technical_support':
          addMessage("I'm sorry to hear you're experiencing technical issues. Let's try to narrow down the problem. What type of issue are you facing?", false);
          addOptions([
            {text: "Software Bug", value: "bug"},
            {text: "Performance Issues", value: "performance"},
            {text: "Integration Problems", value: "integration"}
          ]);
          break;
        case 'billing':
          addMessage("I'd be happy to assist you with billing inquiries. What specific billing question do you have?", false);
          addOptions([
            {text: "Invoice Request", value: "invoice"},
            {text: "Payment Methods", value: "payment"},
            {text: "Subscription Changes", value: "subscription"}
          ]);
          break;
        default:
          addMessage("Thank you for your input. A customer service representative will be with you shortly to address your specific needs.", false);
          break;
      }
    }

    function sendMessage() {
      const message = userInput.value.trim();
      if (message) {
        addMessage(message);
        userInput.value = '';
        processUserInput(message.toLowerCase());
      }
    }

    sendButton.addEventListener('click', sendMessage);
    userInput.addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        sendMessage();
      }
    });

    // Initial greeting and options
    addMessage("Welcome to RadHIL Interactive Live Support! How can we assist you today?", false);
    addOptions([
      {text: "Product Information", value: "product_info"},
      {text: "Technical Support", value: "technical_support"},
      {text: "Billing Inquiries", value: "billing"}
    ]);
  </script>
</body>
</html>
